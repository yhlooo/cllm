# goreleaser 配置
# 参考 https://goreleaser.com

version: 2

builds:
  - id: cllm-bin
    binary: cllm
    main: "./cmd/cllm"
    env:
      - "CGO_ENABLED=0"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - "-X github.com/yhlooo/cllm/pkg/version.Version={{ .Version }}"
      - "-w"

archives:
  - format: "tar.gz"
    name_template: "{{ .Binary }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

dockers_v2:
  - id: cllm-image
    dockerfile: goreleaser.dockerfile
    ids:
      - cllm-bin
    images:
      - "ghcr.io/yhlooo/cllm"
    tags:
      - "v{{ .Version }}"
      - "latest"
    annotations:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.source": "https://github.com/yhlooo/cllm.git"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.created": "{{ .Date }}"
    platforms:
      - linux/amd64
      - linux/arm64

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^style:"
      - "^chore:"
